<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Penny Radar</title>
<style>body{font:15px system-ui;margin:0;background:#f6f7f9;color:#1a1a1a}header{background:#f96302;color:#fff;padding:14px 16px}h1{margin:0;font-size:20px}small{opacity:.9}
.bar{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;position:sticky;top:0;background:#f6f7f9}input,select{padding:9px;border:1px solid #ccc;border-radius:8px;font-size:15px}input{flex:1;min-width:140px}
.c{overflow:hidden;background:#fff;margin:8px 12px;padding:12px;border-radius:10px;box-shadow:0 1px 2px #0002}.n{font-weight:600}.m{color:#555;font-size:13px;margin-top:4px}.b{display:inline-block;padding:2px 7px;border-radius:99px;font-size:12px;margin-right:4px;background:#eee}.lee{background:#d8f5dc;color:#116622}.p{float:right;font-weight:700;font-size:17px;color:#116622}
footer{padding:14px;font-size:12px;color:#666}a{color:#c24e00}</style></head><body>
<header><h1>Penny Radar &middot; Lee County</h1><small id=u></small></header>
<div class=bar><input id=q placeholder="Search name or SKU"><select id=f><option value=all>All items<option value=fl>Reported in Florida<option value=lee>Lee County area</select></div>
<div id=l></div><footer id=s></footer>
<script>const D=__DATA__;u.textContent="Updated "+D.updated+" · "+D.items.length+" SKUs";
s.innerHTML="Sources: "+Object.entries(D.status).map(([k,v])=>k+" ("+v+")").join(", ")+".<br>Community reports, not guarantees. $0.01 shows only at the register; stores may decline. Ranked by retail value × report volume × Florida/Lee signals (retail is a proxy, not resale value). Scan with the HD app first and check out calmly at self-checkout.";
function r(){const t=q.value.toLowerCase(),m=f.value;l.innerHTML=D.items.filter(d=>(!t||(d.name+d.sku).toLowerCase().includes(t))&&(m=="all"||(m=="fl"&&d.fl>0)||(m=="lee"&&d.lee))).slice(0,150).map(d=>`<div class=c>${d.img?`<img src="${d.img}" width=72 height=72 style="float:left;margin-right:10px;border-radius:8px;object-fit:contain">`:''}<span class=p>$${d.retail||"?"}</span><div class=n>${d.name}</div><div class=m><b>${d.zone}</b> · ${d.where}</div><div class=m>SKU ${d.sku} · ${d.reports} reports · seen ${d.last||"?"}</div><div class=m>${d.lee?'<span class="b lee">Lee County report</span>':''}${d.fl?'<span class=b>FL '+d.fl+(d.fl_cities?' ('+d.fl_cities+')':'')+'</span>':''}${d.sources.map(x=>'<span class=b>'+x+'</span>').join('')}<a href="${d.url}">Open in HD (aisle)</a> · <a href="https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(d.name)}&LH_Sold=1&LH_Complete=1">eBay sold</a></div></div>`).join("")}
q.oninput=f.onchange=r;r();</script></body></html>
