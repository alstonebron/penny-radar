name: update
on:
  schedule: [{cron: '7 * * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python build.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "penny-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git commit -m "hourly update" || exit 0; git push
